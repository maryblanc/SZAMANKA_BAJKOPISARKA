<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Szamanka Bajkopisarka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- PASSWORD SCREEN -->


  <div id="lockScreen" class="lock-screen">

    <div class="lock-card">

      <h1>🩷</h1>

      <h2>Enter password</h2>

      <input
        type="password"
        id="passwordInput"
        placeholder="secret phrase..."
      />

      <button onclick="checkPassword()">
        unlock
      </button>

      <p id="errorText"></p>

    </div>

  </div>

  <!-- MAIN APP -->
   <div id="loadingScreen">

  <div class="loader"></div>

</div>

  <div id="app" class="hidden">

    <div class="container">

      <h1 class="title">
        Jebać dziekana i policję ✨
      </h1>
      <p class="subtitle">
  tiny internet made of memories 🩷
      </p>

      <div class="card">

        <h2>Quote of the day</h2>

        <p id="quote">
          skill issue
        </p>

      </div>

      <div class="card">

        <h2>Meme of the day</h2>

        <img
          id="memeImage"
          src="https://placehold.co/400x300"
          alt="meme"
        />

      </div>

      <div class="card">

        <h2>Photo memory 📸</h2>

        <img
          id="photoImage"
          src=""
          alt="photo"
        />

      </div>

      <div class="card">

        <h2>Video memory 🎥</h2>

        <video
          id="videoPlayer"
          controls
          playsinline
          width="100%">
        </video>

      </div>

        <div class="card">

  <h2>Spotify 🎵</h2>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
        width="100%"
        height="152"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
