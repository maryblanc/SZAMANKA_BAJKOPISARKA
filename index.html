<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Szamanka Bajkopisarka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="userBadge"></div>

  <!-- PASSWORD SCREEN -->


  <div id="lockScreen" class="lock-screen">

    <div class="lock-card">

      <h1>🩷</h1>

      <h2>Wpisz tajemne hasło</h2>

      <input
        type="password"
        id="passwordInput"
        placeholder=" czajesz?"
      />

      <button onclick="checkPassword()">
        wejdź...✨
      </button>

      <p id="errorText"></p>

    </div>

  </div>

  <!-- MAIN APP -->
   <div id="loadingScreen">

  <div class="loader"></div>

</div>

  <div id="app" class="hidden">

    <div class="container">

      <h1 class="title">
        Szamanka Bajkopisarka ✨
      </h1>
      <p class="subtitle">
  jakiś mądry opis tu jeszcze wpiszę xd 🩷
      </p>

      <div class="card">

        <h2>Powiedzenie na dziś</h2>

        <p id="quote">
          skill issue
        </p>

      </div>

      <div class="card">

        <h2>Mem na dziś</h2>

        <img
          id="memeImage"
          src="https://placehold.co/400x300"
          alt="meme"
        />

      </div>

      <div class="card">

        <h2>Fota na dziś 📸</h2>

        <img
          id="photoImage"
          src=""
          alt="photo"
        />

      </div>

      <div class="card">

        <h2>Filmik na dziś 🎥</h2>

        <iframe
          id="videoPlayer"
          allow="autoplay"
          allowfullscreen>
        </iframe>

      </div>

        <div class="card">

  <h2>Spotify 🎵</h2>

      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/2Ug5ZoggfDMIYyf89Z8GUQ?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
